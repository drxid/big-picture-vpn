[package]
name = "app"
version = "0.1.0"
description = "Gamepad-driven AmneziaWG VPN toggle for Steam Big Picture"
authors = ["vbukhlov"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

[target.'cfg(windows)'.dependencies]
# Service control (start/stop/query) through the SCM.
windows-service = "0.7"
# Enumerating tunnels: HKLM\SYSTEM\CurrentControlSet\Services is readable by
# ordinary users and carries both the tunnel name and its config path.
winreg = "0.52"
